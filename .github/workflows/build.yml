# Builds UaN for Linux and Windows on every push.
# Pushing a tag like v1.2.0 also publishes the files on the Releases page.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UaN
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp desktop/target/release/bundle/deb/*.deb dist/
            cp desktop/target/release/bundle/appimage/*.AppImage dist/
            # Small update for the AppImage: just the program (the libraries in the AppImage stay).
            gzip -9 -c desktop/target/release/uan > dist/uan-linux-x86_64.gz
          else
            cp desktop/target/release/uan.exe dist/UaN.exe
            # In-app updates on Windows: just the program (no installer).
            gzip -9 -c desktop/target/release/uan.exe > dist/uan-windows-x86_64.exe.gz
            cp desktop/target/release/bundle/nsis/*.exe dist/
          fi
          ls -la dist

      # Plays a real H.264 video inside UaN (with seeking) to check in-app playback on each system.
      # Tests exactly what people download: the installed .deb and the AppImage, with an MKV film.
      - name: Playback self-test (Linux .deb and AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb ffmpeg dbus-x11
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=30:size=640x360:rate=25 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/uan-test.mkv
          sudo apt-get install -y ./dist/*.deb
          chmod +x dist/*.AppImage
          export LIBGL_ALWAYS_SOFTWARE=1  # the app sets the WebKit fallbacks itself
          t() {
            name=$1; shift
            rm -rf "/tmp/uan-$name" "/tmp/r-$name.txt"
            UAN_DATA="/tmp/uan-$name" UAN_SELFTEST_VIDEO=/tmp/uan-test.mkv UAN_SELFTEST_OUT="/tmp/r-$name.txt" timeout 150 dbus-run-session -- xvfb-run -a "$@" || true
            echo "---- result $name ----"
            cat "/tmp/r-$name.txt" || echo "no result"
          }
          t deb uan
          t appimage dist/*.AppImage --appimage-extract-and-run
          grep -q '^ok' /tmp/r-deb.txt && grep -q '^ok' /tmp/r-appimage.txt

      # Small AppImage updates: the program alone must start with the AppImage's libraries, and the
      # AppImage must hand over to a newer program found in ~/.local/share/UaN/bin.
      - name: Small update self-test (Linux AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -x
          V=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          test "$(dist/*.AppImage --appimage-extract-and-run --uan-version)" = "$V"
          gunzip -c dist/uan-linux-x86_64.gz > /tmp/uan-small && chmod +x /tmp/uan-small
          test "$(/tmp/uan-small --uan-version)" = "$V"
          # A fake "newer" program that only answers the version check and records that it was started.
          mkdir -p ~/.local/share/UaN/bin
          printf '#!/bin/sh\nif [ "$1" = --uan-version ]; then echo 99.0.0; else echo started > /tmp/handover; fi\n' > ~/.local/share/UaN/bin/uan-99.0.0
          chmod +x ~/.local/share/UaN/bin/uan-99.0.0
          rm -f /tmp/handover
          timeout 60 dist/*.AppImage --appimage-extract-and-run --hidden || true
          test "$(cat /tmp/handover)" = started
          rm -rf ~/.local/share/UaN/bin

      # "Open in VLC": VLC streams the film from UaN (no download) and is remote-controlled (play, pause, seek).
      - name: VLC self-test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y vlc > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          t() {
            name=$1; shift
            rm -rf "/tmp/uan-$name" "/tmp/r-$name.txt"
            UAN_DATA="/tmp/uan-$name" UAN_SELFTEST_VIDEO=/tmp/uan-test.mkv UAN_SELFTEST_VLC=1 UAN_VLC_EXTRA="--intf=dummy --vout=dummy --aout=dummy" UAN_SELFTEST_OUT="/tmp/r-$name.txt" timeout 150 dbus-run-session -- xvfb-run -a "$@" || true
            echo "---- result $name ----"
            cat "/tmp/r-$name.txt" || echo "no result"
          }
          t vlc-deb uan
          t vlc-appimage dist/*.AppImage --appimage-extract-and-run
          grep -q '^ok' /tmp/r-vlc-deb.txt && grep -q '^ok' /tmp/r-vlc-appimage.txt

      - name: Playback self-test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: desktop
        run: |
          choco install ffmpeg -y --no-progress > /dev/null
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=30:size=640x360:rate=25 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$RUNNER_TEMP/uan-test.mp4"
          for mode in scheme http; do
            rm -rf "$RUNNER_TEMP/uan-$mode"
            if [ "$mode" = http ]; then export UAN_HTTP_MEDIA=1; fi
            UAN_DATA="$RUNNER_TEMP/uan-$mode" UAN_SELFTEST_VIDEO="$RUNNER_TEMP/uan-test.mp4" UAN_SELFTEST_OUT="$RUNNER_TEMP/result-$mode.txt" timeout 150 ./target/release/uan.exe || true
            echo "---- $mode ----"
            cat "$RUNNER_TEMP/result-$mode.txt" || echo "no result"
          done
          grep -q '^ok' "$RUNNER_TEMP/result-scheme.txt" && grep -q '^ok' "$RUNNER_TEMP/result-http.txt"

      - name: VLC self-test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: desktop
        run: |
          choco install vlc -y --no-progress > /dev/null
          rm -rf "$RUNNER_TEMP/uan-vlc"
          UAN_DATA="$RUNNER_TEMP/uan-vlc" UAN_SELFTEST_VIDEO="$RUNNER_TEMP/uan-test.mp4" UAN_SELFTEST_VLC=1 UAN_VLC_EXTRA="--intf=dummy --vout=dummy --aout=dummy" UAN_SELFTEST_OUT="$RUNNER_TEMP/result-vlc.txt" timeout 150 ./target/release/uan.exe || true
          cat "$RUNNER_TEMP/result-vlc.txt" || echo "no result"
          grep -q '^ok' "$RUNNER_TEMP/result-vlc.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: UaN-${{ runner.os }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # The Android app (APK), built from the same code. Signed with UaN's key (GitHub secrets), so a new
  # version installs over the old one.
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # (GitHub's Ubuntu machines come with the Android SDK; ANDROID_HOME points to it.)
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Android project
        working-directory: desktop
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npx --yes @tauri-apps/cli@2 android init --ci
          npx --yes @tauri-apps/cli@2 icon icons/icon.png
          node android-ci/patch.mjs

      - name: Signing key
        working-directory: desktop
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/uan-release.jks"
          printf 'storeFile=%s\nkeyAlias=uan\npassword=%s\n' "$RUNNER_TEMP/uan-release.jks" "$KEYSTORE_PASSWORD" > gen/android/keystore.properties

      - name: Build APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 armv7

      - name: Collect APK
        shell: bash
        run: |
          mkdir dist
          V=$(grep -m1 '"version"' desktop/tauri.conf.json | cut -d'"' -f4)
          find desktop/gen/android -name '*.apk' -path '*release*' | head -5
          APK=$(find desktop/gen/android -name '*universal-release.apk' | head -1)
          test -n "$APK"
          cp "$APK" "dist/UaN_${V}_android.apk"
          ls -la dist
          # It must be signed (an unsigned APK can't be installed).
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$SIGNER" verify --print-certs "dist/UaN_${V}_android.apk" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: UaN-Android
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
