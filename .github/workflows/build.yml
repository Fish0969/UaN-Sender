# Builds UaN for Linux and Windows on every push.
# Pushing a tag like v1.2.0 also publishes the files on the Releases page.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UaN
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp desktop/target/release/bundle/deb/*.deb dist/
            cp desktop/target/release/bundle/appimage/*.AppImage dist/
          else
            cp desktop/target/release/uan.exe dist/UaN.exe
            cp desktop/target/release/bundle/nsis/*.exe dist/
          fi
          ls -la dist

      # Plays a real H.264 video inside UaN (with seeking) to check in-app playback on each system.
      # Tests exactly what people download: the installed .deb and the AppImage, with an MKV film.
      - name: Playback self-test (Linux .deb and AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb ffmpeg dbus-x11
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=30:size=640x360:rate=25 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/uan-test.mkv
          sudo apt-get install -y ./dist/*.deb
          chmod +x dist/*.AppImage
          export LIBGL_ALWAYS_SOFTWARE=1  # the app sets the WebKit fallbacks itself
          t() {
            name=$1; shift
            rm -rf "/tmp/uan-$name" "/tmp/r-$name.txt"
            UAN_DATA="/tmp/uan-$name" UAN_SELFTEST_VIDEO=/tmp/uan-test.mkv UAN_SELFTEST_OUT="/tmp/r-$name.txt" timeout 150 dbus-run-session -- xvfb-run -a "$@" || true
            echo "---- result $name ----"
            cat "/tmp/r-$name.txt" || echo "no result"
          }
          t deb uan
          t appimage dist/*.AppImage --appimage-extract-and-run
          grep -q '^ok' /tmp/r-deb.txt && grep -q '^ok' /tmp/r-appimage.txt

      # "Open in VLC": VLC streams the film from UaN (no download) and is remote-controlled (play, pause, seek).
      - name: VLC self-test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y vlc > /dev/null
          rm -rf /tmp/uan-vlc
          UAN_DATA=/tmp/uan-vlc UAN_SELFTEST_VIDEO=/tmp/uan-test.mkv UAN_SELFTEST_VLC=1 UAN_VLC_EXTRA="--intf=dummy --vout=dummy --aout=dummy" UAN_SELFTEST_OUT=/tmp/r-vlc.txt LIBGL_ALWAYS_SOFTWARE=1 timeout 150 dbus-run-session -- xvfb-run -a uan || true
          cat /tmp/r-vlc.txt || echo "no result"
          grep -q '^ok' /tmp/r-vlc.txt

      - name: Playback self-test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: desktop
        run: |
          choco install ffmpeg -y --no-progress > /dev/null
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=30:size=640x360:rate=25 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$RUNNER_TEMP/uan-test.mp4"
          for mode in scheme http; do
            rm -rf "$RUNNER_TEMP/uan-$mode"
            if [ "$mode" = http ]; then export UAN_HTTP_MEDIA=1; fi
            UAN_DATA="$RUNNER_TEMP/uan-$mode" UAN_SELFTEST_VIDEO="$RUNNER_TEMP/uan-test.mp4" UAN_SELFTEST_OUT="$RUNNER_TEMP/result-$mode.txt" timeout 150 ./target/release/uan.exe || true
            echo "---- $mode ----"
            cat "$RUNNER_TEMP/result-$mode.txt" || echo "no result"
          done
          grep -q '^ok' "$RUNNER_TEMP/result-scheme.txt" && grep -q '^ok' "$RUNNER_TEMP/result-http.txt"

      - name: VLC self-test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: desktop
        run: |
          choco install vlc -y --no-progress > /dev/null
          rm -rf "$RUNNER_TEMP/uan-vlc"
          UAN_DATA="$RUNNER_TEMP/uan-vlc" UAN_SELFTEST_VIDEO="$RUNNER_TEMP/uan-test.mp4" UAN_SELFTEST_VLC=1 UAN_VLC_EXTRA="--intf=dummy --vout=dummy --aout=dummy" UAN_SELFTEST_OUT="$RUNNER_TEMP/result-vlc.txt" timeout 150 ./target/release/uan.exe || true
          cat "$RUNNER_TEMP/result-vlc.txt" || echo "no result"
          grep -q '^ok' "$RUNNER_TEMP/result-vlc.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: UaN-${{ runner.os }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
