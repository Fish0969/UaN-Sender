# Builds UaN for Linux and Windows on every push.
# Pushing a tag like v1.2.0 also publishes the files on the Releases page.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UaN
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp desktop/target/release/bundle/deb/*.deb dist/
            cp desktop/target/release/bundle/appimage/*.AppImage dist/
          else
            cp desktop/target/release/uan.exe dist/UaN.exe
            cp desktop/target/release/bundle/nsis/*.exe dist/
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: UaN-${{ runner.os }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
