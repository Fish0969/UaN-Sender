name = "uan-mailbox"
main = "worker.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "uan-mailbox"
database_id = "f9391250-4d65-4cea-a52a-4c51d78de9f8"

# Small files (photos, short clips) waiting for an offline friend. Encrypted; deleted after pickup or 14 days.
[[kv_namespaces]]
binding = "FILES"
id = "f6ce38f6654e4b7ab94aed2b088c9e0b"

# Theme workshop: published themes (up to 100, 50 MB each: 5 GB at most, inside R2's free 10 GB).
[[r2_buckets]]
binding = "WS"
bucket_name = "uan-themes"

[vars]
# The public account key (from the friend code) that may remove any theme in the workshop.
WS_ADMIN = "6c13755d8abea818c4e7f905ebe9a4ca63b21e925d6823bd9c2b88e71e4ebc04"
